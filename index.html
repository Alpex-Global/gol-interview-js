<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life - Coding Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Conway's Game of Life</h1>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="stopBtn" disabled>Stop</button>
            <button id="clearBtn">Clear</button>
            <button id="randomBtn">Random</button>
            <div class="speed-control">
                <label for="speedSlider">Speed:</label>
                <input type="range" id="speedSlider" min="50" max="1000" value="200" step="50">
                <span id="speedValue">200ms</span>
            </div>
        </div>
        <div id="grid"></div>
        <div class="info">
            <p>Generation: <span id="generation">0</span></p>
            <p>Click cells to toggle them on/off</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
